<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Reference architecture for harnessed inference</title>
  <desc id="desc">A task enters the Agent Harness Runtime through a context compiler, language model, and tool router, then loops back via an observer, verifier, and recovery module to close the control loop or halt with a verified outcome.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8.5,3 z" fill="#3d4652"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8.5,3 z" fill="#2448cc"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7.5,2.5 z" fill="#646b75"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .frame { fill: #f6f9ff; stroke: #7c9bff; stroke-width: 2; stroke-dasharray: 8 5; }
      .frame-title { fill: #2448cc; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .box { fill: #eef3ff; stroke: #28479e; stroke-width: 1.8; }
      .model-box { fill: #dce7ff; stroke: #2d5bff; stroke-width: 2.6; }
      .io-box { fill: #f3f4f6; stroke: #525d6b; stroke-width: 1.8; }
      .label { fill: #1e293b; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
      .detail { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #3d4652; stroke-width: 2.2; marker-end: url(#arrow-dark); }
      .loop-flow { fill: none; stroke: #2448cc; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .state-flow { fill: none; stroke: #646b75; stroke-width: 1.8; stroke-dasharray: 4 4; marker-end: url(#arrow-muted); }
      .edge-lbl { fill: #3d4652; font: 600 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
      .note { fill: #475569; font: italic 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="card" x="10" y="10" width="1180" height="390" rx="12"/>

  <!-- Outer Agent Harness Runtime container -->
  <rect class="frame" x="302" y="54" width="860" height="306" rx="10"/>
  <text class="frame-title" x="312" y="44">Agent Harness Runtime H = (𝒫, 𝒯, 𝒮, ℰ, Π)</text>

  <!-- Top Row: Task -> Context Compiler -> Model -> Tool Router -->
  <rect class="io-box" x="38" y="74" width="196" height="88" rx="8"/>
  <text class="label" x="136" y="109">Task (x)</text>
  <text class="detail" x="136" y="136">goal, files, limits</text>

  <rect class="box" x="320" y="74" width="232" height="88" rx="8"/>
  <text class="label" x="436" y="109">Context Compiler (𝒫)</text>
  <text class="detail" x="436" y="136">prompt, memory, budget</text>

  <rect class="model-box" x="640" y="74" width="216" height="88" rx="8"/>
  <text class="label" x="748" y="109">Model (ℳ)</text>
  <text class="detail" x="748" y="136">plan or next action</text>

  <rect class="box" x="944" y="74" width="200" height="88" rx="8"/>
  <text class="label" x="1044" y="109">Tool Router (𝒯, Π)</text>
  <text class="detail" x="1044" y="136">schema, permissions</text>

  <!-- Bottom Row: Outcome <- Recovery & Stop <- Verifier <- Observer -->
  <rect class="io-box" x="38" y="252" width="196" height="88" rx="8"/>
  <text class="label" x="136" y="287">Outcome</text>
  <text class="detail" x="136" y="314">verified result / halt</text>

  <rect class="box" x="320" y="252" width="232" height="88" rx="8"/>
  <text class="label" x="436" y="287">Recovery &amp; Stop (Π)</text>
  <text class="detail" x="436" y="314">retry, revise, budget</text>

  <rect class="box" x="640" y="252" width="216" height="88" rx="8"/>
  <text class="label" x="748" y="287">Verifier (ℰ)</text>
  <text class="detail" x="748" y="314">tests, graders, checks</text>

  <rect class="box" x="944" y="252" width="200" height="88" rx="8"/>
  <text class="label" x="1044" y="287">Observer (𝒮)</text>
  <text class="detail" x="1044" y="314">traces, state, artifacts</text>

  <!-- Dotted state read path -->
  <path class="state-flow" d="M944 252 L558 164"/>
  <rect x="713" y="196" width="70" height="22" rx="4" fill="#f6f9ff"/>
  <text class="edge-lbl" x="748" y="212" style="font-size: 12.5px; fill: #525d6b;">state 𝒮ₜ</text>

  <!-- Forward & Closed-loop Edges -->
  <path class="flow" d="M234 118 H312"/>
  <text class="edge-lbl" x="273" y="108">input</text>

  <path class="flow" d="M552 118 H632"/>
  <text class="edge-lbl" x="592" y="108">context</text>

  <path class="flow" d="M856 118 H936"/>
  <text class="edge-lbl" x="896" y="108">action aₜ</text>

  <path class="loop-flow" d="M1044 162 V244"/>
  <text class="edge-lbl" x="1054" y="211" style="text-anchor: start; fill: #2448cc;">execute</text>

  <path class="loop-flow" d="M944 296 H864"/>
  <text class="edge-lbl" x="904" y="316" style="fill: #2448cc;">obs. oₜ₊₁</text>

  <path class="loop-flow" d="M640 296 H560"/>
  <text class="edge-lbl" x="600" y="316" style="fill: #2448cc;">verdict</text>

  <path class="loop-flow" d="M436 252 V170"/>
  <text class="edge-lbl" x="426" y="211" style="text-anchor: end; fill: #2448cc;">continue</text>

  <path class="flow" d="M320 296 H242"/>
  <text class="edge-lbl" x="281" y="286">halt</text>

  <text class="note" x="600" y="384">The harness closes the loop: each observation updates state and governs the next context, action, or termination decision.</text>
</svg>
