<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference harness for agentic inference</title>
  <desc id="desc">A task flows through a context compiler and model, then through a tool router, observer, and verifier. The verifier closes the loop back to the context compiler.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b8a"/>
    </marker>
    <style>
      .box { fill: #e8f2ff; stroke: #315b8a; stroke-width: 2; }
      .label { fill: #17324d; font: 700 22px sans-serif; text-anchor: middle; }
      .detail { fill: #315b8a; font: 16px sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #315b8a; stroke-width: 3; marker-end: url(#arrow); }
      .note { fill: #3f4f5f; font: italic 16px sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect x="12" y="12" width="1176" height="406" rx="10" fill="#fff" stroke="#6c7d8f" stroke-width="2"/>

  <rect class="box" x="45" y="70" width="205" height="92" rx="8"/>
  <text class="label" x="147" y="108">Task</text>
  <text class="detail" x="147" y="136">goal, files, constraints</text>

  <rect class="box" x="300" y="70" width="245" height="92" rx="8"/>
  <text class="label" x="422" y="108">Context compiler</text>
  <text class="detail" x="422" y="136">prompt, memory, budget</text>

  <rect class="box" x="595" y="70" width="190" height="92" rx="8"/>
  <text class="label" x="690" y="108">Model</text>
  <text class="detail" x="690" y="136">plan or action</text>

  <path class="arrow" d="M250 116 H292"/>
  <path class="arrow" d="M545 116 H587"/>

  <rect class="box" x="250" y="240" width="220" height="92" rx="8"/>
  <text class="label" x="360" y="278">Tool router</text>
  <text class="detail" x="360" y="306">schema, permissions, retries</text>

  <rect class="box" x="515" y="240" width="220" height="92" rx="8"/>
  <text class="label" x="625" y="278">Observer</text>
  <text class="detail" x="625" y="306">traces, state, artifacts</text>

  <rect class="box" x="780" y="240" width="220" height="92" rx="8"/>
  <text class="label" x="890" y="278">Verifier</text>
  <text class="detail" x="890" y="306">tests, graders, stop</text>

  <path class="arrow" d="M690 162 V205 H360 V232"/>
  <path class="arrow" d="M470 286 H507"/>
  <path class="arrow" d="M735 286 H772"/>
  <path class="arrow" d="M890 240 V190 H422 V170"/>

  <text class="note" x="600" y="382">The harness closes the loop: each observation can change the next context, action, or termination decision.</text>
</svg>
